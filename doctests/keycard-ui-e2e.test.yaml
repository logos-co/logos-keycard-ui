name: "Offering a Keycard's accounts, in its app"
output: keycard-ui-e2e.md
release: ""

# The host is Basecamp in standalone mode: `--module` opens this app, and `--modules-dir` holds
# the module it depends on. The card is the Keycard applet itself, in jCardSim.

intro: |
  A Keycard keeps its keys on the card. Its app, `keycard_ui`, shows the cards in the readers and
  lets the person choose which accounts Logos apps may use, opening the card with its PIN; only
  public keys are kept. It also pairs a 3.x card, changes the PIN and unblocks it with the PUK.

  This doc-test drives the app headless in Basecamp's standalone mode, against `keycard-simulator`:
  the Keycard applet 4.0, built from its source, in jCardSim, set up with PIN 123456 and the
  "abandon … about" test phrase's key.

what_you_build: "The Keycard's app and its module in Basecamp's standalone mode, with a simulated Keycard."

what_you_learn:
  - What the app shows of a card before its PIN
  - How accounts are offered with the PIN, a wrong PIN is refused, and an account is taken back
  - How a card Keycard didn't sign is refused, trusted by the person, and refused again

prerequisites:
  - "**Nix** with flakes enabled."
  - "**A Linux or macOS machine.** The app runs headless, and no card or reader is needed."

sections:
  - title: "Build the pieces"
    step: true
    steps:
      - title: "The host and the test driver"
        run: |
          set -eu
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
      - title: "The Keycard module and its simulator"
        run: |
          set -eu
          nix build 'github:logos-co/logos-keycard-module/4030a200cc535980a786d822dd3e2a4f7643b1cf#install' --no-write-lock-file -o result-module
          nix build 'github:logos-co/logos-keycard-module/4030a200cc535980a786d822dd3e2a4f7643b1cf#simulator' --no-write-lock-file -o result-simulator
        code_block: |
          nix build 'github:logos-co/logos-keycard-module#install' -o result-module
          nix build 'github:logos-co/logos-keycard-module#simulator' -o result-simulator
      - title: "The app"
        run: "nix build 'github:logos-co/logos-keycard-ui{release}#install' --no-write-lock-file -o result-ui"
        code_block: "nix build 'github:logos-co/logos-keycard-ui#install' -o result-ui"
      - title: "Lay out the module for the host"
        run: |
          set -eu
          mkdir -p tree/modules
          nix build 'github:logos-co/logos-keycard-shell-module/b32ab3b06031b768b9846a13cbacd48b2ca91994#install' --no-write-lock-file -o result-shell
          cp -rL result-shell/modules/* tree/modules/
          cp -rL result-module/modules/* tree/modules/
          chmod -R u+w tree
          ls tree/modules result-ui/plugins
        expect_contains:
          - "keycard_module"
          - "keycard_ui"

  - title: "A simulated Keycard"
    step: true
    steps:
      - title: "Start it"
        text: "It prints `ready` once the card is set up."
        run: "sh -c './result-simulator/bin/keycard-simulator 47335 > card.log 2>&1 & echo $! > card.pid'; for i in $(seq 1 60); do grep -q ready card.log && break; sleep 1; done; cat card.log"
        code_block: "keycard-simulator 47335 &        # a 4.0 card on 127.0.0.1:47335"
        expect_contains:
          - "ready 127.0.0.1:47335"

  - title: "Manage a wallet and derive accounts"
    step: true
    steps:
      - title: "Add an Ethereum account from a named card"
        ui_test:
          launch: "env KEYCARD_SIMULATOR=127.0.0.1:47335 KEYCARD_SHELL_EMULATOR=127.0.0.1:1 QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-basecamp/bin/LogosBasecamp --module ./result-ui --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "Wallet home"
              action: wait_for
              texts: ["Keycard wallets", "No accounts yet."]
              timeout: 60000
            - name: "Manage the card"
              action: click_object
              find_value: "manageWallet_0"
            - name: "Name the wallet"
              action: set_text
              find_by: "objectName"
              find_value: "walletName"
              value: "Travel card"
            - name: "Save its name"
              action: click_object
              find_value: "saveWalletName"
            - name: "Close settings"
              action: click_object
              find_value: "manageDone"
            - name: "Choose accounts"
              action: click_object
              find_value: "addAccounts_0"
            - name: "Authorize the public export"
              action: set_text
              find_by: "objectName"
              find_value: "offerPin"
              value: "123456"
            - name: "Show the first five Ethereum accounts"
              action: click_object
              find_value: "showAccounts"
            - name: "Their indexes"
              action: wait_for
              texts: ["Index 0", "Index 4", "m/44'/60'/0'/0/4"]
              timeout: 60000
            - name: "Pick the first"
              action: click_object
              find_value: "selectAccount_0"
            - name: "And the third"
              action: click_object
              find_value: "selectAccount_2"
            - name: "Name them"
              action: click_object
              find_value: "nameAccounts"
            - name: "Name only the first"
              action: set_text
              find_by: "objectName"
              find_value: "addAccountName_0"
              value: "Spending"
            - name: "Add both, without the PIN again"
              action: click_object
              find_value: "keepAccounts"
            - name: "Both accounts are in the wallet"
              action: wait_for
              texts: ["Spending", "Derivation path: m/44'/60'/0'/0/2"]
              timeout: 60000

  - title: "A card Keycard didn't sign"
    step: true
    text: |
      A 4.0 card whose identity no trusted CA signed is refused: one a person loaded the applet onto,
      or a counterfeit. The app offers to review it and shows the card's identity key. The person may
      trust that one card once they confirm they loaded the applet themselves, and stop trusting it.
    steps:
      - title: "Swap in a card another CA signed"
        run: "./result-simulator/bin/keycard-simulator-setup 127.0.0.1:47335 --fresh --untrusted"
        code_block: "keycard-simulator-setup 127.0.0.1:47335 --fresh --untrusted"
        expect_contains:
          - "ready 127.0.0.1:47335"
      - title: "Trust it, then stop trusting it"
        ui_test:
          launch: "env KEYCARD_SIMULATOR=127.0.0.1:47335 KEYCARD_SHELL_EMULATOR=127.0.0.1:1 QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-basecamp/bin/LogosBasecamp --module ./result-ui --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "The card is refused, with a way to review it"
              action: expect_property
              find_by: "objectName"
              find_value: "reviewUnverified"
              property: "visible"
              value: true
              timeout: 60000
            - name: "Review it"
              action: click_object
              find_value: "reviewUnverified"
            - name: "The review opens"
              action: expect_property
              find_by: "objectName"
              find_value: "trustDialog"
              property: "opened"
              value: true
              timeout: 10000
            - name: "The warning and the card's identity"
              action: expect_property
              find_by: "objectName"
              find_value: "untrustedPanel"
              property: "visible"
              value: true
              screenshot: "keycard-ui-untrusted.png"
            - name: "Trusting waits for the person's confirmation"
              action: expect_property
              find_by: "objectName"
              find_value: "trustButton"
              property: "enabled"
              value: false
            - name: "They confirm they loaded the applet"
              action: click_object
              find_value: "trustOwnCard"
            - name: "Trust it"
              action: click_object
              find_value: "trustButton"
            - name: "The review closes"
              action: expect_property
              find_by: "objectName"
              find_value: "trustDialog"
              property: "visible"
              value: false
              timeout: 10000
            - name: "The app says the card is trusted"
              action: expect_property
              find_by: "objectName"
              find_value: "keycardNotice"
              property: "text"
              value: "Trusted: this card is used though Keycard didn't sign it."
              timeout: 10000
              screenshot: "keycard-ui-trusted.png"
            - name: "Nothing is left to review"
              action: expect_property
              find_by: "objectName"
              find_value: "reviewUnverified"
              property: "visible"
              value: false
            - name: "Manage its wallet"
              action: click_object
              find_value: "manageWallet_0"
            - name: "Its settings open"
              action: expect_property
              find_by: "objectName"
              find_value: "manageWalletDialog"
              property: "opened"
              value: true
              timeout: 10000
            - name: "Stop trusting it"
              action: click_object
              find_value: "stopTrusting"
            - name: "Refused again"
              action: expect_property
              find_by: "objectName"
              find_value: "reviewUnverified"
              property: "visible"
              value: true
              timeout: 10000
            - name: "The app says so"
              action: expect_property
              find_by: "objectName"
              find_value: "keycardNotice"
              property: "text"
              value: "No longer trusted: this card is refused again."

  - title: "Stop"
    step: true
    steps:
      - title: "Stop the simulated Keycard"
        run: |
          kill $(cat card.pid) || true
          echo stopped
        expect_contains:
          - "stopped"
